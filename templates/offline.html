<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors connexion — Institut ILAS</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=8">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #091322 0%, #0B3D6E 50%, #1f6feb 100%);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #0f172a;
    padding: 20px;
    box-sizing: border-box;
  }
  .offline-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    padding: 36px 30px;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .offline-icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: #fee2e2;
    color: #ef4444;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    color: #64748b;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .btn-retry {
    background: #1f6feb;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(31,111,235,0.3);
    transition: transform 0.1s, background 0.2s;
  }
  .btn-retry:hover {
    background: #1a5ec4;
  }
</style>
</head>
<body>
<div class="offline-card">
  <div class="offline-icon">📡</div>
  <h1>Mode Hors-Ligne</h1>
  <p>Impossible de joindre le serveur de l'Institut ILAS. Vérifiez votre connexion (Wi-Fi / données mobiles) ou assurez-vous que le PC serveur principal est allumé et connecté.</p>
  
  <div id="reconnectStatus" style="display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:#0284c7; background:#e0f2fe; padding:8px 12px; border-radius:10px; margin-bottom:18px;">
    <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#0284c7; animation:pulseDot 1.2s infinite ease-in-out;"></span>
    <span id="reconnectText">Tentative de reconnexion automatique en cours...</span>
  </div>

  <button class="btn-retry" onclick="window.location.reload()">
    <span>🔄</span>
    <span>Réessayer manuellement</span>
  </button>
</div>

<style>
@keyframes pulseDot {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
</style>

<script>
(function() {
  var isReconnecting = false;
  function pingServer() {
    if (isReconnecting) return;
    fetch('/api/ping?t=' + Date.now(), { cache: 'no-store' })
      .then(function(res) {
        if (res.ok) {
          isReconnecting = true;
          var t = document.getElementById('reconnectText');
          if (t) t.innerText = 'Serveur rétabli ! Reconnexion en cours...';
          var s = document.getElementById('reconnectStatus');
          if (s) {
            s.style.background = '#dcfce7';
            s.style.color = '#15803d';
          }
          setTimeout(function() {
            window.location.reload();
          }, 600);
        } else {
          setTimeout(pingServer, 2500);
        }
      })
      .catch(function() {
        setTimeout(pingServer, 2500);
      });
  }
  setTimeout(pingServer, 1500);
})();
</script>
</body>
</html>
